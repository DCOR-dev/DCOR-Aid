[build-system]
# Defined by PEP 518:
requires = [
    # for version management
    "setuptools>=64", "setuptools_scm[toml]>=8"
]
build-backend = "setuptools.build_meta"

[project]
name = "dcoraid"
authors = [
    # In alphabetical order.
    {name = "Paul Müller"},
    {name = "Eoghan O'Connell"},
    {name = "Raghava Alajangi"},
]
maintainers = [
    {name = "Paul Müller", email="dev@craban.de"},
]
description = "GUI/CLI for managing data on DCOR"
readme = "README.rst"
requires-python = ">=3.10, <4"
keywords = ["RT-DC", "DC", "deformability", "cytometry"]
classifiers = [
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Intended Audience :: Science/Research',
]
license = "GPL-3.0-or-later"
dependencies = [
    "dclab[dcor]>=0.64.2",
    "numpy>=1.21",
    "requests>=2.31",  # CVE-2023-32681
    "urllib3>=2.0",  # requests_toolbelt and general compatibility
    "requests_cache",  # caching API-'get' requests
    "requests_toolbelt>=1.0.0",  # multipart uploads with progress
]
dynamic = ["version"]

[project.optional-dependencies]
GUI = ["PyQt6"]

[project.scripts]
dcoraid = "dcoraid.__main__:main"
dcoraid-archive-circle = "dcoraid.cli.task_archive_circle:archive_circle"
dcoraid-upload-task = "dcoraid.cli.task_upload_task:upload_task"

[project.urls]
source = "https://github.com/DCOR-dev/DCOR-Aid"
tracker = "https://github.com/DCOR-dev/DCOR-Aid/issues"
documentation = "https://dc.readthedocs.io"
changelog = "https://github.com/DCOR-dev/DCOR-Aid/blob/master/CHANGELOG"

[tool.setuptools]
packages = ["dcoraid"]

[tool.setuptools_scm]
write_to = "dcoraid/_version.py"
version_scheme = "post-release"

[tool.coverage.run]
omit = [
    # omit autogenerated ui files
    "*_ui.py",
    ]

[tool.ruff.lint]
ignore = [
    # Do not organize imports (we have our own scheme)
    "I001",
    # Allow catching blind exceptions
    "BLE001",
    # Allow catching blind exceptions
    "S110",
    "S112",
]
